services:
  postgres:
    image: postgres:17-alpine
    container_name: budget-app-postgres
    environment:
      POSTGRES_DB: budget_app
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./infrastructure/database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d budget_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17-alpine
    container_name: budget-app-postgres-test
    environment:
      POSTGRES_DB: budget_app_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"

    volumes:
    - ./infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d budget_app_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
